name: Verify GitHub Pages export

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check types
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build the standard Next.js application
        run: npm run build
      - name: Build GitHub Pages static export
        run: npm run build:pages
      - name: Check the branch publication files
        run: |
          test -s out/index.html
          test -f out/.nojekyll
          test -d out/_next/static
          grep -Fq '/xk-campaign-website-design/_next/static/' out/index.html
          test ! -e out/README.md
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test the exported site under its Pages path
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000/xk-campaign-website-design/
          PLAYWRIGHT_SERVER_COMMAND: npm run preview:pages -- --port 3000
      - name: Save the verified static export
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: pages-static-export
          path: out
          include-hidden-files: true
